name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing to PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/mymem0ry
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
        # Trusted publishing: configure the GitHub repository as a trusted
        # publisher at https://pypi.org/manage/project/mymem0ry/settings/publishing/
        # If you prefer API-token auth, uncomment the line below and set
        # PYPI_API_TOKEN in the repository secrets.
        # env:
        #   UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
